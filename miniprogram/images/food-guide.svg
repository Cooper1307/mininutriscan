  <!-- 水果区 -->
  <path d="M 100 75 L 64.64 89.64 A 50 50 0 0 1 100 25 Z" fill="#E91E63"/>
  
  <!-- 标题 -->
  <text x="100" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFF">均衡饮食指南</text>
