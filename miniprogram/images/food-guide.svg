<svg width="200" height="150" viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="foodGuideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BC34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="150" fill="url(#foodGuideGrad)" rx="10"/>
  
  <!-- 餐盘 -->
  <circle cx="100" cy="75" r="50" fill="#FFF" stroke="#E0E0E0" stroke-width="2"/>
  
  <!-- 食物分区 -->
  <!-- 蔬菜区 -->
