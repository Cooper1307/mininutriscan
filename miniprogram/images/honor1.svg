<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="honor1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 奖牌背景 -->
  <circle cx="60" cy="60" r="50" fill="url(#honor1Gradient)" stroke="#FF8F00" stroke-width="3"/>
  
  <!-- 内圈 -->
  <circle cx="60" cy="60" r="35" fill="#FFF8E1" stroke="#FFD700" stroke-width="2"/>
  
  <!-- 奖杯图标 -->
  <g transform="translate(45, 40)">
    <!-- 奖杯杯身 -->
    <rect x="8" y="15" width="14" height="18" fill="#FFD700" rx="2"/>
    <!-- 奖杯底座 -->
    <rect x="5" y="33" width="20" height="4" fill="#FFD700" rx="2"/>
    <rect x="7" y="37" width="16" height="3" fill="#FFD700" rx="1"/>
    <!-- 奖杯把手 -->
    <ellipse cx="3" cy="20" rx="3" ry="6" fill="none" stroke="#FFD700" stroke-width="2"/>
    <ellipse cx="27" cy="20" rx="3" ry="6" fill="none" stroke="#FFD700" stroke-width="2"/>
    <!-- 奖杯顶部 -->
    <rect x="10" y="10" width="10" height="5" fill="#FFD700" rx="2"/>
  </g>
  
  <!-- 文字 -->
  <text x="60" y="95" text-anchor="middle" fill="#FF8F00" font-family="Arial, sans-serif" font-size="10" font-weight="bold">优秀奖</text>
</svg>