<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="honor2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9E9E9E;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 奖牌背景 -->
  <circle cx="60" cy="60" r="50" fill="url(#honor2Gradient)" stroke="#757575" stroke-width="3"/>
  
  <!-- 内圈 -->
  <circle cx="60" cy="60" r="35" fill="#F5F5F5" stroke="#C0C0C0" stroke-width="2"/>
  
  <!-- 星星图标 -->
  <g transform="translate(60, 60)">
    <polygon points="0,-20 6,-6 20,-6 10,2 16,16 0,8 -16,16 -10,2 -20,-6 -6,-6" fill="#C0C0C0"/>
    <polygon points="0,-15 4,-4 15,-4 7,1 12,12 0,6 -12,12 -7,1 -15,-4 -4,-4" fill="#F5F5F5"/>
  </g>
  
  <!-- 文字 -->
  <text x="60" y="95" text-anchor="middle" fill="#757575" font-family="Arial, sans-serif" font-size="10" font-weight="bold">银奖</text>
</svg>