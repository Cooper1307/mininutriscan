<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E1F5FE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B3E5FC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>
  
  <!-- 主标题 -->
  <rect x="50" y="80" width="300" height="60" fill="#03A9F4" rx="12"/>
  <text x="200" y="115" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">营养扫描小程序</text>
  
  <!-- 副标题 -->
  <text x="200" y="170" text-anchor="middle" fill="#0277BD" font-family="Arial, sans-serif" font-size="16">智能营养分析专家</text>
  <text x="200" y="195" text-anchor="middle" fill="#0277BD" font-family="Arial, sans-serif" font-size="16">让健康饮食更简单</text>
  
  <!-- 装饰元素 -->
  <circle cx="100" cy="50" r="15" fill="#4CAF50" opacity="0.7"/>
  <circle cx="300" cy="60" r="12" fill="#FF9800" opacity="0.7"/>
  <circle cx="80" cy="250" r="18" fill="#E91E63" opacity="0.7"/>
  <circle cx="320" cy="240" r="14" fill="#9C27B0" opacity="0.7"/>
  
  <!-- 底部信息 -->
  <text x="200" y="250" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">扫码体验，开启健康生活</text>
</svg>