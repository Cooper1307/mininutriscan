<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="aboutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#aboutGradient)"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="260" height="40" fill="#4CAF50" rx="8"/>
  <text x="150" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">关于我们</text>
  
  <!-- Logo区域 -->
  <circle cx="80" cy="110" r="25" fill="#4CAF50"/>
  <text x="80" y="118" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16">🥗</text>
  
  <!-- 信息区域 -->
  <rect x="120" y="80" width="160" height="70" fill="#fff" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 文本信息 -->
  <text x="130" y="100" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">营养扫描</text>
  <text x="130" y="118" fill="#666" font-family="Arial, sans-serif" font-size="12">版本: 1.0.0</text>
  <text x="130" y="133" fill="#666" font-family="Arial, sans-serif" font-size="12">智能营养分析专家</text>
  
  <!-- 底部信息 -->
  <text x="150" y="175" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">让健康饮食更简单</text>
</svg>