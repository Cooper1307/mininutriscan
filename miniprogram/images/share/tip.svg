<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="tipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#tipGradient)"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="260" height="40" fill="#4CAF50" rx="8"/>
  <text x="150" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">营养小贴士</text>
  
  <!-- 内容区域 -->
  <rect x="20" y="80" width="260" height="100" fill="#fff" rx="8" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 图标 -->
  <circle cx="50" cy="110" r="15" fill="#FFD54F"/>
  <text x="50" y="116" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="16">💡</text>
  
  <!-- 文本内容 -->
  <text x="80" y="105" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">健康饮食建议</text>
  <text x="80" y="125" fill="#666" font-family="Arial, sans-serif" font-size="12">均衡营养，合理搭配</text>
  <text x="80" y="145" fill="#666" font-family="Arial, sans-serif" font-size="12">多吃蔬果，少油少盐</text>
  <text x="80" y="165" fill="#666" font-family="Arial, sans-serif" font-size="12">适量运动，健康生活</text>
</svg>