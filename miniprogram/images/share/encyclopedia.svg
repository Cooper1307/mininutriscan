<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="encyclopediaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F3E5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E1BEE7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#encyclopediaGradient)"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="260" height="40" fill="#9C27B0" rx="8"/>
  <text x="150" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">营养百科全书</text>
  
  <!-- 书本图标 -->
  <rect x="60" y="80" width="40" height="60" fill="#fff" stroke="#9C27B0" stroke-width="2" rx="4"/>
  <line x1="70" y1="90" x2="90" y2="90" stroke="#9C27B0" stroke-width="1"/>
  <line x1="70" y1="100" x2="90" y2="100" stroke="#9C27B0" stroke-width="1"/>
  <line x1="70" y1="110" x2="90" y2="110" stroke="#9C27B0" stroke-width="1"/>
  <line x1="70" y1="120" x2="90" y2="120" stroke="#9C27B0" stroke-width="1"/>
  
  <!-- 食物图标 -->
  <circle cx="140" cy="100" r="8" fill="#4CAF50"/>
  <circle cx="160" cy="110" r="8" fill="#FF9800"/>
  <circle cx="180" cy="100" r="8" fill="#F44336"/>
  <circle cx="200" cy="120" r="8" fill="#2196F3"/>
  
  <!-- 信息区域 -->
  <rect x="120" y="130" width="160" height="40" fill="#fff" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 文本信息 -->
  <text x="130" y="145" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">丰富的营养知识库</text>
  <text x="130" y="160" fill="#666" font-family="Arial, sans-serif" font-size="11">了解食物营养价值和健康功效</text>
  
  <!-- 底部信息 -->
  <text x="150" y="185" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">学习营养知识，享受健康生活</text>
</svg>