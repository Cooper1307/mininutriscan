<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="detectionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#detectionGradient)"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="260" height="40" fill="#2196F3" rx="8"/>
  <text x="150" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">智能检测</text>
  
  <!-- 扫描框 -->
  <rect x="60" y="80" width="60" height="60" fill="none" stroke="#2196F3" stroke-width="3" rx="8"/>
  
  <!-- 扫描线 -->
  <line x1="70" y1="110" x2="110" y2="110" stroke="#2196F3" stroke-width="3" opacity="0.8"/>
  
  <!-- 角标 -->
  <path d="M 60 80 L 70 80 L 70 90" fill="none" stroke="#2196F3" stroke-width="4"/>
  <path d="M 120 80 L 110 80 L 110 90" fill="none" stroke="#2196F3" stroke-width="4"/>
  <path d="M 60 140 L 70 140 L 70 130" fill="none" stroke="#2196F3" stroke-width="4"/>
  <path d="M 120 140 L 110 140 L 110 130" fill="none" stroke="#2196F3" stroke-width="4"/>
  
  <!-- 信息区域 -->
  <rect x="140" y="90" width="140" height="50" fill="#fff" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 文本信息 -->
  <text x="150" y="110" fill="#333" font-family="Arial, sans-serif" font-size="14" font-weight="bold">AI智能识别</text>
  <text x="150" y="125" fill="#666" font-family="Arial, sans-serif" font-size="12">快速分析营养成分</text>
  
  <!-- 底部信息 -->
  <text x="150" y="170" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">拍照即可获得详细营养报告</text>
</svg>