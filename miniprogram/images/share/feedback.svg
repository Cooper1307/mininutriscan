<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="feedbackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="300" height="200" fill="url(#feedbackGradient)"/>
  
  <!-- 标题区域 -->
  <rect x="20" y="20" width="260" height="40" fill="#FF9800" rx="8"/>
  <text x="150" y="45" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="bold">意见反馈</text>
  
  <!-- 反馈图标 -->
  <rect x="60" y="80" width="40" height="30" fill="#fff" stroke="#FF9800" stroke-width="2" rx="4"/>
  <polygon points="80,110 75,120 85,120" fill="#FF9800"/>
  
  <!-- 星星评分 -->
  <g transform="translate(120, 85)">
    <polygon points="10,0 12,6 18,6 13,10 15,16 10,12 5,16 7,10 2,6 8,6" fill="#FFD54F"/>
    <polygon points="30,0 32,6 38,6 33,10 35,16 30,12 25,16 27,10 22,6 28,6" fill="#FFD54F"/>
    <polygon points="50,0 52,6 58,6 53,10 55,16 50,12 45,16 47,10 42,6 48,6" fill="#FFD54F"/>
    <polygon points="70,0 72,6 78,6 73,10 75,16 70,12 65,16 67,10 62,6 68,6" fill="#FFD54F"/>
    <polygon points="90,0 92,6 98,6 93,10 95,16 90,12 85,16 87,10 82,6 88,6" fill="#FFD54F"/>
  </g>
  
  <!-- 信息区域 -->
  <rect x="60" y="130" width="180" height="40" fill="#fff" rx="6" stroke="#E0E0E0" stroke-width="1"/>
  
  <!-- 文本信息 -->
  <text x="70" y="145" fill="#333" font-family="Arial, sans-serif" font-size="12" font-weight="bold">您的意见很重要</text>
  <text x="70" y="160" fill="#666" font-family="Arial, sans-serif" font-size="11">帮助我们改进产品体验</text>
  
  <!-- 底部信息 -->
  <text x="150" y="185" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">感谢您的宝贵建议</text>
</svg>