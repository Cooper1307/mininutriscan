<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- 营养扫描图标 -->
  <g transform="translate(30, 30)">
    <!-- 扫描框 -->
    <rect x="10" y="10" width="40" height="40" fill="none" stroke="#fff" stroke-width="2" rx="4"/>
    
    <!-- 扫描线 -->
    <line x1="15" y1="30" x2="45" y2="30" stroke="#fff" stroke-width="2" opacity="0.8"/>
    
    <!-- 营养元素点 -->
    <circle cx="20" cy="20" r="2" fill="#FFD54F"/>
    <circle cx="30" cy="25" r="2" fill="#FF8A65"/>
    <circle cx="40" cy="20" r="2" fill="#81C784"/>
    <circle cx="25" cy="35" r="2" fill="#64B5F6"/>
    <circle cx="35" cy="40" r="2" fill="#F06292"/>
  </g>
  
  <!-- 应用名称缩写 -->
  <text x="60" y="85" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="bold">营养扫描</text>
</svg>