<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="shareLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E7D32;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="90" fill="url(#shareLogoGradient)" stroke="#fff" stroke-width="4"/>
  
  <!-- 营养扫描图标 -->
  <g transform="translate(50, 50)">
    <!-- 扫描框 -->
    <rect x="20" y="20" width="60" height="60" fill="none" stroke="#fff" stroke-width="3" rx="6"/>
    
    <!-- 扫描线 -->
    <line x1="30" y1="50" x2="70" y2="50" stroke="#fff" stroke-width="3" opacity="0.8"/>
    
    <!-- 营养元素点 -->
    <circle cx="35" cy="35" r="3" fill="#FFD54F"/>
    <circle cx="50" cy="40" r="3" fill="#FF8A65"/>
    <circle cx="65" cy="35" r="3" fill="#81C784"/>
    <circle cx="40" cy="60" r="3" fill="#64B5F6"/>
    <circle cx="60" cy="65" r="3" fill="#F06292"/>
  </g>
  
  <!-- 应用名称 -->
  <text x="100" y="160" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">营养扫描</text>
  <text x="100" y="180" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="12">NutriScan</text>
</svg>