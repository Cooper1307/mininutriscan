<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="honor4Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E91E63;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AD1457;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 奖牌背景 -->
  <circle cx="60" cy="60" r="50" fill="url(#honor4Gradient)" stroke="#880E4F" stroke-width="3"/>
  
  <!-- 内圈 -->
  <circle cx="60" cy="60" r="35" fill="#FCE4EC" stroke="#E91E63" stroke-width="2"/>
  
  <!-- 钻石图标 -->
  <g transform="translate(60, 60)">
    <polygon points="0,-18 -8,-8 -12,0 0,18 12,0 8,-8" fill="#E91E63"/>
    <polygon points="0,-13 -5,-5 -8,0 0,13 8,0 5,-5" fill="#FCE4EC"/>
    <polygon points="0,-8 -3,-3 -5,0 0,8 5,0 3,-3" fill="#E91E63"/>
  </g>
  
  <!-- 文字 -->
  <text x="60" y="95" text-anchor="middle" fill="#880E4F" font-family="Arial, sans-serif" font-size="10" font-weight="bold">钻石奖</text>
</svg>