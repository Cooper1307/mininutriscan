<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A5D6A7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#coverGradient)"/>
  
  <!-- 主标题 -->
  <rect x="50" y="50" width="300" height="60" fill="#4CAF50" rx="12"/>
  <text x="200" y="85" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">营养扫描小程序</text>
  
  <!-- 副标题 -->
  <text x="200" y="140" text-anchor="middle" fill="#2E7D32" font-family="Arial, sans-serif" font-size="16">智能识别食物营养成分</text>
  <text x="200" y="165" text-anchor="middle" fill="#2E7D32" font-family="Arial, sans-serif" font-size="16">科学指导健康饮食</text>
  
  <!-- 装饰元素 -->
  <circle cx="80" cy="200" r="20" fill="#FFD54F" opacity="0.8"/>
  <circle cx="320" cy="180" r="15" fill="#FF8A65" opacity="0.8"/>
  <circle cx="120" cy="250" r="12" fill="#81C784" opacity="0.8"/>
  <circle cx="280" cy="240" r="18" fill="#64B5F6" opacity="0.8"/>
  
  <!-- 底部信息 -->
  <text x="200" y="270" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">扫一扫，了解食物营养价值</text>
</svg>