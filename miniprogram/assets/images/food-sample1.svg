<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="sample1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="150" fill="url(#sample1Gradient)" rx="8"/>
  
  <!-- 苹果 -->
  <ellipse cx="100" cy="75" rx="35" ry="40" fill="#F44336"/>
  <ellipse cx="95" cy="70" rx="8" ry="12" fill="#FFCDD2" opacity="0.7"/>
  
  <!-- 苹果叶子 -->
  <ellipse cx="110" cy="45" rx="8" ry="15" fill="#4CAF50" transform="rotate(30 110 45)"/>
  
  <!-- 苹果柄 -->
  <rect x="98" y="35" width="4" height="10" fill="#8D6E63" rx="2"/>
  
  <!-- 标签 -->
  <rect x="20" y="120" width="160" height="20" fill="#fff" rx="4" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="133" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12">新鲜红苹果</text>
</svg>