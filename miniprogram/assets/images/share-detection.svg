<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="detectionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF3E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0B2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="400" height="300" fill="url(#detectionGradient)"/>
  
  <!-- 主标题 -->
  <rect x="50" y="50" width="300" height="60" fill="#FF9800" rx="12"/>
  <text x="200" y="85" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">营养检测结果</text>
  
  <!-- 扫描图标 -->
  <rect x="150" y="130" width="100" height="80" fill="none" stroke="#FF9800" stroke-width="3" rx="8"/>
  <line x1="160" y1="170" x2="240" y2="170" stroke="#FF9800" stroke-width="2"/>
  
  <!-- 营养元素点 -->
  <circle cx="170" cy="150" r="3" fill="#4CAF50"/>
  <circle cx="200" cy="160" r="3" fill="#2196F3"/>
  <circle cx="230" cy="150" r="3" fill="#F44336"/>
  <circle cx="185" cy="190" r="3" fill="#FF9800"/>
  <circle cx="215" cy="185" r="3" fill="#9C27B0"/>
  
  <!-- 底部信息 -->
  <text x="200" y="240" text-anchor="middle" fill="#E65100" font-family="Arial, sans-serif" font-size="16">智能识别食物营养</text>
  <text x="200" y="270" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="12">扫一扫，了解营养成分</text>
</svg>