<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="tip1Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="150" fill="url(#tip1Gradient)" rx="8"/>
  
  <!-- 图标 -->
  <circle cx="100" cy="50" r="25" fill="#2196F3"/>
  <text x="100" y="58" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="20">💧</text>
  
  <!-- 标题 -->
  <text x="100" y="95" text-anchor="middle" fill="#1976D2" font-family="Arial, sans-serif" font-size="14" font-weight="bold">多喝水</text>
  
  <!-- 描述 -->
  <text x="100" y="115" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">每日8杯水</text>
  <text x="100" y="130" text-anchor="middle" fill="#666" font-family="Arial, sans-serif" font-size="11">促进新陈代谢</text>
