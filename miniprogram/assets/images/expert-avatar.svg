<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E3F2FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BBDEFB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="45" fill="url(#avatarGradient)" stroke="#2196F3" stroke-width="2"/>
  
  <!-- 头部 -->
  <circle cx="50" cy="35" r="15" fill="#2196F3"/>
  
  <!-- 身体 -->
  <ellipse cx="50" cy="70" rx="20" ry="15" fill="#2196F3"/>
  
  <!-- 专家标识 -->
  <circle cx="70" cy="30" r="8" fill="#4CAF50"/>
  <text x="70" y="34" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="8">✓</text>
  
  <!-- 底部文字 -->
  <text x="50" y="90" text-anchor="middle" fill="#1976D2" font-family="Arial, sans-serif" font-size="8" font-weight="bold">营养专家</text>
</svg>