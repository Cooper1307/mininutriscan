<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="sample2Gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8E6C9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="200" height="150" fill="url(#sample2Gradient)" rx="8"/>
  
  <!-- 香蕉 -->
  <path d="M 60 90 Q 70 60 90 55 Q 110 50 130 55 Q 140 60 135 75 Q 130 90 120 95 Q 100 100 80 95 Q 65 90 60 90" fill="#FFEB3B"/>
  
  <!-- 香蕉纹理 -->
  <path d="M 70 70 Q 80 65 90 70" fill="none" stroke="#FFC107" stroke-width="2"/>
  <path d="M 90 75 Q 100 70 110 75" fill="none" stroke="#FFC107" stroke-width="2"/>
  <path d="M 110 80 Q 120 75 125 80" fill="none" stroke="#FFC107" stroke-width="2"/>
  
  <!-- 香蕉柄 -->
  <ellipse cx="135" cy="60" rx="3" ry="8" fill="#8D6E63"/>
  
  <!-- 标签 -->
  <rect x="20" y="120" width="160" height="20" fill="#fff" rx="4" stroke="#E0E0E0" stroke-width="1"/>
  <text x="100" y="133" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="12">优质香蕉</text>
</svg>